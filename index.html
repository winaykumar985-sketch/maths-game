<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 3-Lane Runner</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 10px; touch-action: manipulation; }
        h2 { margin: 5px 0; }
        #equation { color: #f1c40f; font-size: 32px; margin: 10px 0; font-weight: bold; }
        #gameCanvas { background-color: #34495e; border: 4px solid #ecf0f1; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); display: block; margin: 0 auto; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .btn { background-color: #3498db; color: white; padding: 15px 30px; font-size: 20px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; width: 120px; }
        .btn:active { background-color: #2980b9; }
    </style>
</head>
<body>

    <h2>Math Runner</h2>
    <div id="score">Score: 0 | Speed: 1</div>
    <div id="equation">Loading...</div>
    
    <!-- The Running Track -->
    <canvas id="gameCanvas" width="300" height="400"></canvas>

    <!-- Mobile Controls -->
    <div class="controls">
        <button class="btn" onclick="moveLeft()">⬅️ LEFT</button>
        <button class="btn" onclick="moveRight()">RIGHT ➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let playerLane = 1; // 0 = Left, 1 = Center, 2 = Right
        let score = 0;
        let speed = 2.5;
        let speedLevel = 1;
        let obsY = 0;
        let answers = [0, 0, 0];
        let correctLane = 0;
        let gameOver = false;
        let animationId;

        // Generate a new math problem and answers
        function newProblem() {
            let n1 = Math.floor(Math.random() * 10) + 1;
            let n2 = Math.floor(Math.random() * 10) + 1;
            document.getElementById("equation").innerText = `${n1} + ${n2} = ?`;
            
            let ans = n1 + n2;
            answers = [ans + 1, ans - 1, ans + 2]; // Create fake answers
            
            correctLane = Math.floor(Math.random() * 3); // Pick a random lane (0, 1, or 2)
            answers[correctLane] = ans; // Put the correct answer in that lane
            
            obsY = -50; // Start answers above the screen
        }

        // The Main Game Loop
        function draw() {
            if (gameOver) return;

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw track lanes
            ctx.strokeStyle = "#7f8c8d";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(100, 0); ctx.lineTo(100, 400); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(200, 0); ctx.lineTo(200, 400); ctx.stroke();

            // Move answers down the track
            obsY += speed;

            // Draw the 3 answer boxes
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = "#e74c3c"; // Red boxes
                ctx.fillRect(i * 100 + 10, obsY, 80, 50);
                ctx.fillStyle = "white";
                ctx.font = "24px Arial";
                ctx.fillText(answers[i], i * 100 + 35, obsY + 33);
            }

            // Draw Player (Green Block)
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(playerLane * 100 + 25, 330, 50, 50);

            // Check Collision (Did the boxes reach the player?)
            if (obsY + 50 > 330 && obsY < 380) {
                if (playerLane === correctLane) {
                    // Correct! Increase score and reset
                    score++;
                    if (score % 4 === 0) {
                        speed += 0.5; // Speed up every 4 points
                        speedLevel++;
                    }
                    document.getElementById("score").innerText = `Score: ${score} | Speed: ${speedLevel}`;
                    newProblem();
                } else {
                    // Crash! Game Over
                    gameOver = true;
                    document.getElementById("equation").innerText = "CRASH! Game Over";
                    document.getElementById("equation").style.color = "#e74c3c";
                    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "white";
                    ctx.fillText("Refresh to Play Again", 40, 200);
                }
            }

            // Keep the loop running
            animationId = requestAnimationFrame(draw);
        }

        // Controls
        function moveLeft() { if (playerLane > 0) playerLane--; }
        function moveRight() { if (playerLane < 2) playerLane++; }
        
        // Keyboard controls for laptop testing
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") moveLeft();
            if (e.key === "ArrowRight") moveRight();
        });

        // Start Game
        newProblem();
        draw();
    </script>

</body>
</html>
