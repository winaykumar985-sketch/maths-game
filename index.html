<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Runner - Full Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 10px; touch-action: manipulation; }
        h1, h2 { margin: 5px 0; }
        
        /* Menu Styles */
        #menuScreen { background-color: #ecf0f1; color: #2c3e50; max-width: 350px; margin: 50px auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        select, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 5px; border: 1px solid #bdc3c7; }
        .start-btn { background-color: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; }
        
        /* Game Styles */
        #gameArea { display: none; }
        #equation { color: #f1c40f; font-size: 32px; margin: 10px 0; font-weight: bold; background: rgba(0,0,0,0.5); display: inline-block; padding: 5px 15px; border-radius: 10px;}
        #gameCanvas { background-color: #34495e; border: 4px solid #ecf0f1; border-radius: 10px; display: block; margin: 0 auto; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .btn { background-color: #3498db; color: white; padding: 15px 30px; font-size: 20px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; width: 120px; }
    </style>
</head>
<body>

    <!-- Syllabus Selection Menu -->
    <div id="menuScreen">
        <h1>Math Runner</h1>
        <p>Select your class to load the syllabus:</p>
        
        <select id="boardSelect">
            <option value="state">Karnataka State Board</option>
            <option value="cbse">CBSE</option>
        </select>

        <select id="classSelect">
            <option value="1">Standard 1 (Basic Addition)</option>
            <option value="2">Standard 2 (Advanced Addition)</option>
            <option value="3">Standard 3 (Multiplication)</option>
        </select>

        <button class="start-btn" onclick="startGame()">Load Textbook & Start</button>
    </div>

    <!-- The Running Game -->
    <div id="gameArea">
        <div id="scoreDisplay">Score: 0 | Speed: Level 1</div>
        <div id="equation">Loading...</div>
        
        <canvas id="gameCanvas" width="300" height="400"></canvas>

        <div class="controls">
            <button class="btn" onclick="moveLeft()">⬅️ LEFT</button>
            <button class="btn" onclick="moveRight()">RIGHT ➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let playerLane = 1; 
        let score = 0;
        let speed = 1.2; // Drastically reduced starting speed
        let speedLevel = 1;
        let obsY = -50;
        let answers = [0, 0, 0];
        let correctLane = 0;
        let gameOver = false;
        let trackOffset = 0;
        let currentStandard = 1;

        function startGame() {
            // Read selected class
            currentStandard = parseInt(document.getElementById("classSelect").value);
            
            // Hide menu, show game
            document.getElementById("menuScreen").style.display = "none";
            document.getElementById("gameArea").style.display = "block";
            
            // Reset variables
            score = 0;
            speed = 1.2;
            speedLevel = 1;
            playerLane = 1;
            gameOver = false;
            
            newProblem();
            draw();
        }

        function newProblem() {
            let n1, n2, ans;

            // Logic matching the selected syllabus standard
            if (currentStandard === 1) {
                n1 = Math.floor(Math.random() * 5) + 1;
                n2 = Math.floor(Math.random() * 5) + 1;
                ans = n1 + n2;
                document.getElementById("equation").innerText = `${n1} + ${n2} = ?`;
            } else if (currentStandard === 2) {
                n1 = Math.floor(Math.random() * 15) + 5;
                n2 = Math.floor(Math.random() * 10) + 5;
                ans = n1 + n2;
                document.getElementById("equation").innerText = `${n1} + ${n2} = ?`;
            } else if (currentStandard === 3) {
                n1 = Math.floor(Math.random() * 5) + 2;
                n2 = Math.floor(Math.random() * 5) + 2;
                ans = n1 * n2;
                document.getElementById("equation").innerText = `${n1} x ${n2} = ?`;
            }
            
            // Create fake answers and assign correct lane
            answers = [ans + 1, ans - 1, ans + 2];
            correctLane = Math.floor(Math.random() * 3);
            answers[correctLane] = ans;
            
            obsY = -50; 
        }

        function draw() {
            if (gameOver) return;

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw moving track lines to simulate running forward
            trackOffset += speed;
            if (trackOffset > 40) trackOffset = 0;

            ctx.strokeStyle = "#7f8c8d";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]); // Dashed lines
            
            ctx.beginPath(); 
            ctx.moveTo(100, -40 + trackOffset); 
            ctx.lineTo(100, 400); 
            ctx.stroke();
            
            ctx.beginPath(); 
            ctx.moveTo(200, -40 + trackOffset); 
            ctx.lineTo(200, 400); 
            ctx.stroke();
            
            ctx.setLineDash([]); // Reset dashed lines for boxes

            // Move obstacle down
            obsY += speed;

            // Draw the 3 answer boxes
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(i * 100 + 10, obsY, 80, 50);
                ctx.fillStyle = "white";
                ctx.font = "24px Arial";
                ctx.fillText(answers[i], i * 100 + 35, obsY + 33);
            }

            // Draw Player
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(playerLane * 100 + 25, 330, 50, 50);

            // Collision Detection
            if (obsY + 50 > 330 && obsY < 380) {
                if (playerLane === correctLane) {
                    score++;
                    if (score % 3 === 0) {
                        speed += 0.3; // Speed up slightly
                        speedLevel++;
                    }
                    document.getElementById("scoreDisplay").innerText = `Score: ${score} | Speed: Level ${speedLevel}`;
                    newProblem();
                } else {
                    gameOver = true;
                    document.getElementById("equation").innerText = "Game Over!";
                    document.getElementById("equation").style.color = "#e74c3c";
                    
                    // Show Restart Button
                    setTimeout(() => {
                        document.getElementById("gameArea").style.display = "none";
                        document.getElementById("menuScreen").style.display = "block";
                    }, 2000);
                }
            }

            requestAnimationFrame(draw);
        }

        // Controls
        function moveLeft() { if (playerLane > 0) playerLane--; }
        function moveRight() { if (playerLane < 2) playerLane++; }
        
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") moveLeft();
            if (e.key === "ArrowRight") moveRight();
        });
    </script>
</body>
</html>
