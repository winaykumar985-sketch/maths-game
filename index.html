<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Runner Math</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 10px; touch-action: manipulation; }
        
        /* Menu Styles */
        #menuScreen { background-color: #ecf0f1; color: #2c3e50; max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #e67e22; font-size: 32px; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 5px; border: 1px solid #bdc3c7; box-sizing: border-box; }
        .start-btn { background-color: #d35400; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 20px; }
        
        /* Game Area */
        #gameArea { display: none; position: relative; max-width: 400px; margin: 20px auto; }
        #gameCanvas { background-color: #87CEEB; border: 4px solid #ecf0f1; border-radius: 10px; display: block; width: 100%; }
        .stats { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        
        /* Pop-Up Quiz Modal */
        #quizModal { display: none; position: absolute; top: 10%; left: 5%; width: 90%; background: rgba(44, 62, 80, 0.95); border: 3px solid #f1c40f; border-radius: 15px; padding: 20px; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10; }
        #timerDisplay { color: #e74c3c; font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        #equation { font-size: 40px; color: #f1c40f; font-weight: bold; margin: 15px 0; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background-color: #3498db; color: white; padding: 15px; font-size: 24px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .option-btn:active { background-color: #2980b9; }
    </style>
</head>
<body>

    <!-- Menu Screen -->
    <div id="menuScreen">
        <h1>🐈 Cat Runner Math</h1>
        <p>Help the cat jump by solving math problems. The timer gets faster every jump!</p>
        
        <select id="classSelect">
            <option value="1">Class 1 (Basic Addition)</option>
            <option value="2">Class 2 (Double Addition)</option>
            <option value="3">Class 3 (Multiplication)</option>
            <option value="4">Class 4 (Subtraction)</option>
            <option value="5">Class 5 (Basic Division)</option>
            <option value="6">Class 6 (Decimals)</option>
            <option value="7">Class 7 (Basic Algebra)</option>
            <option value="8">Class 8 (Squares)</option>
            <option value="9">Class 9 (Square Roots)</option>
            <option value="10">Class 10 (Linear Equations)</option>
        </select>
        <button class="start-btn" onclick="startGame()">Start Running</button>
    </div>

    <!-- Game Screen -->
    <div id="gameArea">
        <div class="stats">
            <div id="scoreDisplay">Jumps: 0</div>
            <div id="statusDisplay">Running...</div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="300"></canvas>
        
        <!-- The Pop-Up Quiz -->
        <div id="quizModal">
            <div id="timerDisplay">15.0s</div>
            <div id="equation">Loading...</div>
            <div class="options-grid">
                <button class="option-btn" onclick="checkAnswer(0)" id="btn0">A</button>
                <button class="option-btn" onclick="checkAnswer(1)" id="btn1">B</button>
                <button class="option-btn" onclick="checkAnswer(2)" id="btn2">C</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let currentClass = 1;
        
        // Game Animation Variables
        let isRunning = false;
        let isPausedForQuiz = false;
        let catX = 50;
        let catY = 220; // Ground level
        let obstacleX = 400;
        let jumpOffset = 0;
        let backgroundOffset = 0;

        // Quiz & Timer Variables
        let maxTime = 15.0; // Start with 15 seconds
        let currentTime = 15.0;
        let timerInterval;
        let correctOptionIndex = 0;

        function startGame() {
            currentClass = parseInt(document.getElementById("classSelect").value);
            document.getElementById("menuScreen").style.display = "none";
            document.getElementById("gameArea").style.display = "block";
            
            score = 0;
            maxTime = 15.0;
            obstacleX = 400;
            catY = 220;
            jumpOffset = 0;
            isRunning = true;
            isPausedForQuiz = false;
            
            document.getElementById("scoreDisplay").innerText = `Jumps: ${score}`;
            document.getElementById("statusDisplay").innerText = "Running...";
            
            gameLoop();
        }

        // --- VISUAL GAME LOOP ---
        function gameLoop() {
            if (!isRunning) return;

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background (Sky)
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Ground (Grass)
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(0, 250, canvas.width, 50);

            // Move scenery if not paused
            if (!isPausedForQuiz) {
                backgroundOffset -= 2;
                obstacleX -= 3; // Obstacle moves left toward cat
                
                // Draw moving grass lines for speed effect
                ctx.fillStyle = "#27ae60";
                for(let i = 0; i < 10; i++) {
                    ctx.fillRect(((i * 50) + backgroundOffset) % 400, 260, 20, 10);
                }
                if (backgroundOffset <= -50) backgroundOffset = 0;

                // TRIGGER POP-UP WHEN OBSTACLE IS NEAR
                if (obstacleX < catX + 60 && obstacleX > catX) {
                    isPausedForQuiz = true;
                    triggerPopUp();
                }
            }

            // Draw Obstacle (A brick wall)
            ctx.fillStyle = "#c0392b";
            ctx.fillRect(obstacleX, 200, 30, 50);

            // Draw Cat Emoji
            ctx.font = "50px Arial";
            ctx.fillText("🐈", catX, catY - jumpOffset);

            // Simple Jump Animation Logic (after answering correctly)
            if (jumpOffset > 0) {
                obstacleX -= 5; // Move obstacle past cat while in air
                jumpOffset -= 2; // Cat comes back down
            }

            requestAnimationFrame(gameLoop);
        }

        // --- QUIZ & TIMER LOGIC ---
        function triggerPopUp() {
            document.getElementById("statusDisplay").innerText = "JUMP! Answer fast!";
            document.getElementById("quizModal").style.display = "block";
            
            // Adaptive Timer: 15s base, minus 0.5s for every correct answer (minimum 3 seconds)
            maxTime = Math.max(3.0, 15.0 - (score * 0.5));
            currentTime = maxTime;
            
            generateMathProblem();
            
            // Start Countdown
            timerInterval = setInterval(() => {
                currentTime -= 0.1;
                document.getElementById("timerDisplay").innerText = currentTime.toFixed(1) + "s";

                if (currentTime <= 0) {
                    gameOver("TIME OUT!");
                }
            }, 100);
        }

        function generateMathProblem() {
            let qText = "";
            let ans = 0;
            let n1, n2;

            // Syllabus Logic matching Classes 1 to 10
            switch(currentClass) {
                case 1: n1 = Math.floor(Math.random() * 9) + 1; n2 = Math.floor(Math.random() * 9) + 1; ans = n1 + n2; qText = `${n1} + ${n2} = ?`; break;
                case 2: n1 = Math.floor(Math.random() * 40) + 10; n2 = Math.floor(Math.random() * 40) + 10; ans = n1 + n2; qText = `${n1} + ${n2} = ?`; break;
                case 3: n1 = Math.floor(Math.random() * 9) + 2; n2 = Math.floor(Math.random() * 9) + 2; ans = n1 * n2; qText = `${n1} x ${n2} = ?`; break;
                case 4: n1 = Math.floor(Math.random() * 50) + 50; n2 = Math.floor(Math.random() * 40) + 10; ans = n1 - n2; qText = `${n1} - ${n2} = ?`; break;
                case 5: n2 = Math.floor(Math.random() * 9) + 2; ans = Math.floor(Math.random() * 9) + 2; n1 = n2 * ans; qText = `${n1} ÷ ${n2} = ?`; break;
                case 6: n1 = (Math.random() * 5).toFixed(1); n2 = (Math.random() * 5).toFixed(1); ans = parseFloat(n1) + parseFloat(n2); ans = Math.round(ans * 10) / 10; qText = `${n1} + ${n2} = ?`; break;
                case 7: ans = Math.floor(Math.random() * 10) + 2; n2 = Math.floor(Math.random() * 10) + 1; n1 = ans + n2; qText = `x + ${n2} = ${n1}`; break;
                case 8: n1 = Math.floor(Math.random() * 11) + 2; ans = n1 * n1; qText = `${n1}² = ?`; break;
                case 9: ans = Math.floor(Math.random() * 12) + 2; n1 = ans * ans; qText = `√${n1} = ?`; break;
                case 10: ans = Math.floor(Math.random() * 10) + 2; n1 = Math.floor(Math.random() * 5) + 2; n2 = ans * n1; qText = `${n1}x = ${n2}`; break;
            }

            document.getElementById("equation").innerText = qText;

            let fake1 = ans + (Math.floor(Math.random() * 3) + 1);
            let fake2 = ans - (Math.floor(Math.random() * 3) + 1);
            if (fake1 === fake2 || fake2 < 0) fake2 = ans + 5;
            if (currentClass === 6) { fake1 = (ans + 1.1).toFixed(1); fake2 = (ans - 1.1).toFixed(1); } 

            let options = [ans, fake1, fake2];
            options.sort(() => Math.random() - 0.5); 
            correctOptionIndex = options.indexOf(ans);

            document.getElementById("btn0").innerText = options[0];
            document.getElementById("btn1").innerText = options[1];
            document.getElementById("btn2").innerText = options[2];
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            
            if (selectedIndex === correctOptionIndex) {
                // Correct: Hide pop-up, trigger jump, resume running
                document.getElementById("quizModal").style.display = "none";
                score++;
                document.getElementById("scoreDisplay").innerText = `Jumps: ${score}`;
                document.getElementById("statusDisplay").innerText = "Running...";
                
                jumpOffset = 80; // Cat jumps up 80 pixels
                isPausedForQuiz = false; // Resume game loop
                
                // Spawn new obstacle far ahead
                setTimeout(() => { obstacleX = 400; }, 1000); 

            } else {
                gameOver("CRASHED!");
            }
        }

        function gameOver(reason) {
            clearInterval(timerInterval);
            isRunning = false;
            
            // Draw crash text on canvas
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#e74c3c";
            ctx.font = "40px Arial";
            ctx.fillText(reason, 80, 150);
            
            document.getElementById("quizModal").style.display = "none";
            document.getElementById("statusDisplay").innerText = "Game Over";
            
            setTimeout(() => {
                document.getElementById("gameArea").style.display = "none";
                document.getElementById("menuScreen").style.display = "block";
            }, 3000);
        }
    </script>
</body>
</html>
